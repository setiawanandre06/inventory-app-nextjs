name: Next.js CI

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run
        continue-on-error: false

      - name: Build Next.js
        run: npm run build

  deploy:
    needs: build

    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "Deploying production..."